<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Alto y Ancho</title>
    <link rel="stylesheet" href="13-css-height-width.css">
</head>
<body>

    <h1>Height y Width en CSS</h1>

    <h2>Height y Width</h2>

    <div class="box1">
        height: 150px <br>
        width: 50%;
    </div>

    <h2>Width fijo</h2>

    <div class="box2">
        width: 400px
    </div>

    <h2>Max Width</h2>

    <div class="box3">
        width: 100% y max-width: 600px
    </div>

    <h2>Min y Max Height</h2>

    <div class="box4">
        Este elemento utiliza min-height y max-height.
    </div>

</body>
</html>
