<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Íconos</title>

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <!-- Google Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">

    <!-- Bootstrap Icons (Glyphicons) -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">

    <style>
        body{
            margin:0;
            padding:30px;
            background:#eef2f7;
            font-family:Arial, sans-serif;
        }

        h1{
            text-align:center;
            color:#0d6efd;
            margin-bottom:35px;
        }

        .contenedor{
            display:flex;
            justify-content:center;
            flex-wrap:wrap;
            gap:25px;
        }

        .tarjeta{
            width:220px;
            background:white;
            border-radius:12px;
            padding:20px;
            text-align:center;
            box-shadow:0 4px 10px rgba(0,0,0,.15);
            transition:.3s;
        }

        .tarjeta:hover{
            transform:translateY(-6px);
        }

        .icono{
            font-size:60px;
            margin-bottom:15px;
        }

        .azul{
            color:#0d6efd;
        }

        .rojo{
            color:#dc3545;
        }

        .verde{
            color:#198754;
        }

        .naranja{
            color:#fd7e14;
        }

        h2{
            margin:10px 0;
        }

        p{
            color:#555;
        }
    </style>
</head>
<body>

<h1>Bibliotecas de Íconos</h1>

<div class="contenedor">

    <div class="tarjeta">
        <i class="fas fa-cloud icono azul"></i>
        <h2>Font Awesome</h2>
        <p>Ícono de nube.</p>
    </div>

    <div class="tarjeta">
        <i class="glyphicon glyphicon-user icono verde"></i>
        <h2>Bootstrap</h2>
        <p>Ícono de usuario.</p>
    </div>

    <div class="tarjeta">
        <i class="material-icons icono rojo">favorite</i>
        <h2>Google Icons</h2>
        <p>Ícono de favorito.</p>
    </div>

    <div class="tarjeta">
        <i class="fas fa-car icono naranja"></i>
        <h2>Personalizable</h2>
        <p>Los íconos cambian de tamaño y color con CSS.</p>
    </div>

</div>

</body>
</html>
