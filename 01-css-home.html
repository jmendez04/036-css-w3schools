<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Introducción a CSS</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: white;
            text-align: center;
        }

        p {
            font-family: Verdana, sans-serif;
            font-size: 20px;
            text-align: center;
        }

        .ejemplo {
            background-color: white;
            width: 70%;
            margin: 30px auto;
            padding: 20px;
            border-radius: 8px;
        }

        h2 {
            color: steelblue;
        }

        code {
            display: block;
            background-color: #f4f4f4;
            padding: 15px;
            border-left: 5px solid steelblue;
            font-family: Consolas, monospace;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>Mi Primer Ejemplo con CSS</h1>

    <p>CSS permite cambiar la apariencia de una página web.</p>

    <div class="ejemplo">
        <h2>Ejemplo de estilos</h2>

<code>body {
    background-color: lightblue;
}

h1 {
    color: white;
    text-align: center;
}

p {
    font-family: Verdana;
    font-size: 20px;
}</code>

    </div>

</body>
</html>
