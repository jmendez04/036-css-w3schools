<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Z-Index</title>
    <link rel="stylesheet" href="26-css-zindex.css">
</head>
<body>

<h1>Propiedad z-index</h1>
<p>Las cajas se superponen gracias a <strong>position</strong> y <strong>z-index</strong>.</p>

<div class="contenedor">
    <div class="caja negra">Black Box (z-index: 1)</div>
    <div class="caja gris">Gray Box (z-index: 3)</div>
    <div class="caja verde">Green Box (z-index: 2)</div>
</div>

</body>
</html>
