<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Relleno</title>
    <link rel="stylesheet" href="12-css-padding.css">
</head>
<body>

    <h1>Padding en CSS</h1>

    <h2>Padding individual</h2>

    <div class="individual">
        Este elemento utiliza padding en cada lado.
    </div>

    <h2>Padding shorthand</h2>

    <div class="shorthand">
        Este elemento utiliza la propiedad shorthand.
    </div>

    <h2>Box Sizing</h2>

    <div class="normal">
        Width: 300px + padding (content-box)
    </div>

    <div class="border-box">
        Width: 300px con box-sizing: border-box
    </div>

</body>
</html>
