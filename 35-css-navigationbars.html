<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Barras de navegación</title>
    <link rel="stylesheet" href="35-css-navigationbars.css">
</head>
<body>

<h1>CSS Navigation Bars</h1>

<h2>Barra horizontal</h2>
<nav>
    <ul class="horizontal">
        <li><a class="active" href="#">Inicio</a></li>
        <li><a href="#">Noticias</a></li>
        <li><a href="#">Servicios</a></li>
        <li><a href="#">Contacto</a></li>
    </ul>
</nav>

<h2>Barra vertical</h2>
<div class="contenido">
    <ul class="vertical">
        <li><a class="active" href="#">Inicio</a></li>
        <li><a href="#">Productos</a></li>
        <li><a href="#">Galería</a></li>
        <li><a href="#">Acerca de</a></li>
    </ul>

    <section>
        <h3>Contenido principal</h3>
        <p>Este texto es de ejemplo para mostrar cómo una barra vertical puede colocarse al lado del contenido de una página.</p>
    </section>
</div>

</body>
</html>
