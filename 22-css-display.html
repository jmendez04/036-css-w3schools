<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSS Display</title>
    <link rel="stylesheet" href="22-css-display.css">
</head>
<body>

<h1>CSS Display</h1>

<h2>display: block</h2>
<span class="block">Elemento 1</span>
<span class="block">Elemento 2</span>

<h2>display: inline</h2>
<ul class="menu">
    <li>Inicio</li>
    <li>Servicios</li>
    <li>Contacto</li>
</ul>

<h2>display: inline-block</h2>
<div class="caja">HTML</div>
<div class="caja">CSS</div>
<div class="caja">JS</div>

<h2>display: none</h2>
<p class="oculto">Este texto está oculto.</p>
<p>Este texto sí es visible.</p>

<h2>visibility: hidden</h2>
<p class="invisible">Este ocupa espacio pero no se ve.</p>
<p>Este aparece debajo.</p>

</body>
</html>
