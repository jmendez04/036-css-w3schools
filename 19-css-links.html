<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CSS Links</title>
    <link rel="stylesheet" href="19-css-links.css">
</head>
<body>

<div class="contenedor">

    <h1>CSS Links</h1>
    <p class="descripcion">
        Ejemplo de los diferentes estados de los enlaces usando CSS.
    </p>

    <div class="tarjeta">
        <h2>Enlaces normales</h2>

        <a href="https://www.google.com" target="_blank">Google</a>
        <a href="https://www.github.com" target="_blank">GitHub</a>
        <a href="https://www.w3schools.com" target="_blank">W3Schools</a>
    </div>

    <div class="tarjeta">
        <h2>Botones con enlaces</h2>

        <a class="btn verde" href="#">Aceptar</a>
        <a class="btn azul" href="#">Más información</a>
        <a class="btn rojo" href="#">Eliminar</a>
    </div>

    <div class="tarjeta">
        <h2>Menú de navegación</h2>

        <nav>
            <a class="menu" href="#">Inicio</a>
            <a class="menu" href="#">Servicios</a>
            <a class="menu" href="#">Galería</a>
            <a class="menu" href="#">Contacto</a>
        </nav>
    </div>

</div>

</body>
</html>
