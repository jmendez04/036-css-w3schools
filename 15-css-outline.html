<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contornos</title>
    <link rel="stylesheet" href="15-css-outline.css">
</head>
<body>

    <h1>Outline en CSS</h1>

    <h2>Outline Style</h2>

    <p class="dotted">Outline punteado</p>
    <p class="dashed">Outline discontinuo</p>
    <p class="solid">Outline sólido</p>

    <h2>Outline Width</h2>

    <p class="width">Outline de 5px</p>

    <h2>Outline Color</h2>

    <p class="color">Outline rojo</p>

    <h2>Outline Shorthand</h2>

    <p class="short">Outline con shorthand</p>

    <h2>Outline con Border Radius</h2>

    <p class="round">Outline redondeado</p>

    <h2>Outline Offset</h2>

    <p class="offset">Outline separado del borde</p>

</body>
</html>
