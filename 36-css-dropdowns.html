<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Menús desplegables</title>
    <link rel="stylesheet" href="36-css-dropdowns.css">
</head>
<body>

<h1>CSS Dropdowns</h1>

<h2>Dropdown de texto</h2>

<div class="dropdown">
    <button class="dropbtn">Pasa el cursor</button>
    <div class="dropdown-content">
        <p>¡Hola! Este es un texto desplegable.</p>
    </div>
</div>

<h2>Dropdown con menú</h2>

<div class="dropdown">
    <button class="dropbtn">Opciones</button>
    <div class="dropdown-content">
        <a href="#">Inicio</a>
        <a href="#">Servicios</a>
        <a href="#">Contacto</a>
    </div>
</div>

<h2>Dropdown con imagen</h2>

<div class="dropdown">
    <img src="https://picsum.photos/220/140" alt="Imagen">
    <div class="dropdown-content imagen">
        <img src="https://picsum.photos/320/200" alt="Imagen ampliada">
    </div>
</div>

</body>
</html>
