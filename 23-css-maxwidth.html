<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ancho máximo</title>
    <link rel="stylesheet" href="23-css-maxwidth.css">
</head>
<body>

<h1>Propiedad max-width</h1>

<div class="width">
    <h2>width: 500px</h2>
    <p>Este contenedor tiene un ancho fijo de 500px.</p>
</div>

<div class="max-width">
    <h2>max-width: 500px</h2>
    <p>Este contenedor puede reducir su tamaño cuando la pantalla es más pequeña.</p>
</div>

</body>
</html>
