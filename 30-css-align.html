<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Centrado</title>
    <link rel="stylesheet" href="30-css-align.css">
</head>
<body>

<h1>CSS Center Align</h1>

<h2>margin: auto</h2>
<div class="bloque">
    Este bloque está centrado horizontalmente.
</div>

<h2>text-align: center</h2>
<p class="texto">
    Este texto está centrado.
</p>

<h2>Imagen centrada</h2>
<img src="https://picsum.photos/220/140" alt="Ejemplo">

<h2>Flexbox</h2>
<div class="flex">
    <p>Contenido centrado</p>
</div>

<h2>Grid</h2>
<div class="grid">
    <p>Contenido centrado</p>
</div>

</body>
</html>
