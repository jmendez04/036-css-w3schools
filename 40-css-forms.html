<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formularios</title>
    <link rel="stylesheet" href="40-css-forms.css">
</head>
<body>

<h1>CSS Forms</h1>

<form>
    <h2>Formulario de registro</h2>

    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" placeholder="Escribe tu nombre">

    <label for="correo">Correo electrónico</label>
    <input type="email" id="correo" placeholder="correo@ejemplo.com">

    <label for="clave">Contraseña</label>
    <input type="password" id="clave" placeholder="Escribe tu contraseña">

    <label for="pais">País</label>
    <select id="pais">
        <option>Guatemala</option>
        <option>Honduras</option>
        <option>El Salvador</option>
    </select>

    <label for="mensaje">Mensaje</label>
    <textarea id="mensaje" placeholder="Escribe un mensaje"></textarea>

    <input type="submit" value="Enviar formulario">
</form>

</body>
</html>
