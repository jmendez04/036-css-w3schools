<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Opacidad</title>
    <link rel="stylesheet" href="34-css-opacity.css">
</head>
<body>

<h1>CSS Opacity</h1>

<h2>Diferentes niveles de opacidad</h2>

<div class="galeria">
    <img class="o20" src="https://picsum.photos/id/1015/220/150" alt="Imagen">
    <img class="o50" src="https://picsum.photos/id/1016/220/150" alt="Imagen">
    <img class="o100" src="https://picsum.photos/id/1018/220/150" alt="Imagen">
</div>

<h2>Efecto Hover</h2>

<div class="galeria">
    <img class="hover" src="https://picsum.photos/id/1025/220/150" alt="Imagen">
    <img class="hover" src="https://picsum.photos/id/1035/220/150" alt="Imagen">
    <img class="hover" src="https://picsum.photos/id/1043/220/150" alt="Imagen">
</div>

<h2>Caja transparente con RGBA</h2>

<div class="fondo">
    <div class="transparente">
        <p>Este texto es de ejemplo para demostrar una caja con fondo semitransparente utilizando RGBA.</p>
    </div>
</div>

</body>
</html>
