<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modelo de Caja</title>
    <link rel="stylesheet" href="14-css-box-model.css">
</head>
<body>

    <h1>Modelo de Caja en CSS</h1>

    <div class="box">
        <h2>Contenido</h2>
        <p>
            Este elemento demuestra cómo el contenido, el padding,
            el borde y el margen forman el modelo de caja en CSS.
        </p>
    </div>

    <div class="info">
        <h3>Tamaño de la caja</h3>
        <p><strong>Contenido:</strong> 320px × 50px</p>
        <p><strong>Padding:</strong> 10px</p>
        <p><strong>Borde:</strong> 5px</p>
        <p><strong>Margen:</strong> 20px</p>
    </div>

</body>
</html>
