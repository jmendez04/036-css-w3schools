<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>En línea por bloques</title>
    <link rel="stylesheet" href="29-css-inlineblock.css">
</head>
<body>

<h1>Display: inline-block</h1>

<h2>Display: inline</h2>

<p>
    <span class="a">HTML</span>
    <span class="a">CSS</span>
    <span class="a">JavaScript</span>
</p>

<h2>Display: inline-block</h2>

<p>
    <span class="b">HTML</span>
    <span class="b">CSS</span>
    <span class="b">JavaScript</span>
</p>

<h2>Display: block</h2>

<span class="c">HTML</span>
<span class="c">CSS</span>
<span class="c">JavaScript</span>

<h2>Menú horizontal</h2>

<ul class="nav">
    <li>Inicio</li>
    <li>Servicios</li>
    <li>Galería</li>
    <li>Contacto</li>
</ul>

</body>
</html>
