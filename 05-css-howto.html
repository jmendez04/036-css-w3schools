<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cómo agregar CSS</title>

    <link rel="stylesheet" href="05-css-how-to.css">

    <style>
        .interno {
            color: darkgreen;
            background-color: #dff0d8;
            padding: 10px;
            border-radius: 5px;
        }
    </style>

</head>
<body>

    <h1>Formas de agregar CSS</h1>

    <h2>1. CSS Externo</h2>
    <p class="externo">
        Este párrafo obtiene sus estilos desde un archivo CSS externo.
    </p>

    <h2>2. CSS Interno</h2>
    <p class="interno">
        Este párrafo utiliza estilos definidos dentro de la etiqueta &lt;style&gt;.
    </p>

    <h2>3. CSS Inline</h2>
    <p style="color: crimson; background-color: #ffe5e5; padding: 10px; border-radius: 5px;">
        Este párrafo utiliza el atributo <strong>style</strong> directamente en el elemento.
    </p>

</body>
</html>
